name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/tome-neo4j-dev
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 64m
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 40s

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tome-neo4j-dev

    steps:
      - name: Checkout tome-neo4j
        uses: actions/checkout@v4
        with:
          path: tome-neo4j

      - name: Checkout tome
        uses: actions/checkout@v4
        with:
          repository: silentorb/tome
          path: tome
          ref: ${{ vars.TOME_REF || 'main' }}

      - name: Checkout imp-cypher
        uses: actions/checkout@v4
        with:
          repository: silentorb/imp-cypher
          path: imp-cypher
          ref: ${{ vars.IMP_CYPHER_REF || 'main' }}

      - name: Checkout imp-ts
        uses: actions/checkout@v4
        with:
          repository: silentorb/imp-ts
          path: imp-ts
          ref: ${{ vars.IMP_TS_REF || 'main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        working-directory: tome-neo4j
        run: bun install

      - name: Typecheck and test
        working-directory: tome-neo4j
        run: bun test
